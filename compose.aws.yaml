# Opcional para comprovação real do AWS Secrets Manager.
# Defina AWS_SECRET_ID no .env e AWS_CONFIG_DIR contendo arquivos AWS CLI
# (geralmente ~/.aws; no Windows use o caminho completo no terminal).
services:
  api:
    environment:
      AWS_PROFILE: ${AWS_PROFILE:-default}
      AWS_SHARED_CREDENTIALS_FILE: /home/node/.aws/credentials
      AWS_CONFIG_FILE: /home/node/.aws/config
    volumes:
      - ${AWS_CONFIG_DIR:?Defina AWS_CONFIG_DIR para sua pasta .aws}:/home/node/.aws:ro
